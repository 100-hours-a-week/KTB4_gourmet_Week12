name: gourmet-community

services:
  db:
    image: mysql:8.0
    container_name: gourmet-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - gourmet-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: gourmet-backend
    restart: unless-stopped

    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

      UPLOAD_DIR: /app/uploads
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      TZ: Asia/Seoul

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - uploads-data:/app/uploads

    expose:
      - "8080"

    networks:
      - gourmet-network


  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile

    container_name: gourmet-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - gourmet-network


volumes:
  mysql-data:
  uploads-data:


networks:
  gourmet-network:
    driver: bridge