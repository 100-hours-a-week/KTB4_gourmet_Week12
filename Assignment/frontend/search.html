<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>통합 검색 · Gourmet Community</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./css/gc-theme.css">
    <link rel="stylesheet" href="./css/board-shell.css">
    <link rel="stylesheet" href="./css/search.css">
    <link rel="stylesheet" href="./css/profile-menu.css">

    <script src="./js/api.js" defer></script>
    <script src="./js/board-meta.js" defer></script>
    <script src="./js/profile-menu.js" defer></script>
    <script src="./js/navigation.js" defer></script>
    <script src="./js/search.js" defer></script>
</head>

<body>
    <div class="page">
        <div class="atmosphere" aria-hidden="true"></div>

        <header class="header search-header">
            <button
                type="button"
                class="search-back-button"
                id="search-back-button"
                aria-label="게시판으로 돌아가기"
            >
                ‹
            </button>

            <img
                class="header-logo"
                id="main-logo"
                src="./gourmet_community_logo.png"
                alt="Gourmet Community"
                width="52"
                height="52"
            >

            <form
                class="header-search"
                id="header-search"
                role="search"
            >
                <label
                    class="visually-hidden"
                    for="search-input"
                >
                    통합 검색
                </label>

                <input
                    type="search"
                    id="search-input"
                    name="keyword"
                    placeholder="검색어를 입력해주세요."
                    autocomplete="off"
                    maxlength="100"
                >

                <button
                    type="submit"
                    class="search-submit"
                >
                    검색
                </button>
            </form>

            <div class="profile-menu-wrapper">
                <button
                    type="button"
                    class="profile-button"
                    id="header-profile-button"
                    aria-label="프로필 메뉴"
                ></button>

                <ul
                    class="profile-dropdown"
                    id="profile-dropdown"
                >
                    <li id="go-edit-profile">
                        회원정보수정
                    </li>

                    <li id="go-edit-password">
                        비밀번호수정
                    </li>

                    <li id="logout-button">
                        로그아웃
                    </li>
                </ul>
            </div>
        </header>

        <main class="search-main">
            <section class="search-intro">
                <p class="search-eyebrow">
                    Integrated Search
                </p>

                <h1>통합 검색</h1>

                <p>
                    자유 게시판, 질문, 학습 기록,
                    프로젝트 모집 게시글을 한 번에 검색합니다.
                </p>
            </section>

            <form
                class="search-filter-form"
                id="search-filter-form"
            >
                <div class="search-filter-field">
                    <label for="search-type">
                        검색 범위
                    </label>

                    <select id="search-type">
                        <option value="ALL">
                            전체
                        </option>

                        <option value="TITLE">
                            제목
                        </option>

                        <option value="CONTENT">
                            내용
                        </option>

                        <option value="NICKNAME">
                            작성자
                        </option>
                    </select>
                </div>

                <div class="search-filter-field">
                    <label for="board-type">
                        게시판
                    </label>

                    <select id="board-type">
                        <option value="">
                            전체 게시판
                        </option>

                        <option value="FREE">
                            자유 게시판
                        </option>

                        <option value="QUESTION">
                            질문 게시판
                        </option>

                        <option value="STUDY">
                            학습 기록
                        </option>

                        <option value="PROJECT">
                            프로젝트 모집
                        </option>
                    </select>
                </div>

                <div class="search-filter-field">
                    <label for="sort-type">
                        정렬
                    </label>

                    <select id="sort-type">
                        <option value="LATEST">
                            최신순
                        </option>

                        <option value="VIEW_COUNT">
                            조회수순
                        </option>
                    </select>
                </div>

                <button
                    type="submit"
                    class="filter-submit-button"
                >
                    조건 적용
                </button>
            </form>

            <section class="search-result-section">
                <div class="search-result-header">
                    <h2 id="search-result-title">
                        검색 결과
                    </h2>

                    <p id="search-result-count">
                        검색어를 입력해주세요.
                    </p>
                </div>

                <div
                    class="search-result-list"
                    id="search-result-list"
                ></div>

                <nav
                    class="search-pagination"
                    aria-label="검색 결과 페이지"
                >
                    <button
                        type="button"
                        id="previous-page-button"
                    >
                        이전
                    </button>

                    <span id="page-information">
                        1 / 1
                    </span>

                    <button
                        type="button"
                        id="next-page-button"
                    >
                        다음
                    </button>
                </nav>
            </section>
        </main>
    </div>
</body>
</html>
