upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # SSE 실시간 알림 연결
    # /api/notifications/subscribe
    # → backend:8080/notifications/subscribe
    location = /api/notifications/subscribe {
        proxy_pass http://backend_upstream/notifications/subscribe;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 응답을 모아두지 않고 즉시 전달
        proxy_buffering off;
        proxy_cache off;

        # 장시간 연결 유지
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 연결을 Nginx가 임의로 변경하지 않도록 설정
        proxy_set_header Connection "";

        # 일부 환경에서 응답 버퍼링 방지
        add_header X-Accel-Buffering no;
    }

    # STOMP WebSocket
    # /api/ws/chat -> backend:8080/ws/chat
    location = /api/ws/chat {
        proxy_pass http://backend_upstream/ws/chat;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 일반 Backend API
    # /api/users → backend:8080/users
    # /api/posts → backend:8080/posts
    location /api/ {
        proxy_pass http://backend_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /uploads 경로를 유지하여 Backend로 전달
    location /uploads/ {
        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 모든 요청은 Frontend 컨테이너로 전달
    location / {
        proxy_pass http://frontend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}