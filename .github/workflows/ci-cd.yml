name: Gourmet Community CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "Assignment/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gourmet-community-production
  cancel-in-progress: false

jobs:
  backend-ci:
    name: Backend Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Assignment

    env:
      JWT_SECRET: github-actions-ci-test-secret-key-over-32-bytes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Assignment/*.gradle*
            Assignment/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew clean test --no-daemon

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar --no-daemon


  frontend-ci:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Assignment/frontend-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Assignment/frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build


  docker-ci:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    defaults:
      run:
        working-directory: Assignment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Check Docker and Compose
        run: |
          docker version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - docker-ci

    timeout-minutes: 40

    steps:
      - name: Configure deployment SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" \
            > ~/.ssh/gourmet_week12_actions

          chmod 600 ~/.ssh/gourmet_week12_actions

          printf '%s\n' "$EC2_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/gourmet_week12_actions \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          cd "$HOME/KTB4_gourmet_Week12"

          git fetch origin main
          git reset --hard origin/main

          test -f Assignment/.env

          cd Assignment

          docker compose config --quiet

          docker compose up \
            -d \
            --build \
            --remove-orphans

          docker compose ps

          for attempt in $(seq 1 24); do
            frontend_status=$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                http://127.0.0.1/ \
                || true
            )

            backend_status=$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                http://127.0.0.1/api/users/me \
                || true
            )

            echo \
              "Health check ${attempt}/24: frontend=${frontend_status}, backend=${backend_status}"

            if [ "$frontend_status" = "200" ] \
              && [ "$backend_status" = "401" ]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            sleep 5
          done

          echo "Deployment health check failed."

          docker compose ps
          docker compose logs --tail=200

          exit 1

          REMOTE_SCRIPT